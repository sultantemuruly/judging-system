server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS resolver — required for lazy upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback — send all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket proxy to Go backend
    # Using variable in proxy_pass defers DNS resolution to runtime (not startup)
    location /ws {
        set $backend http://server:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Health check proxy
    location /health {
        set $backend http://server:8080;
        proxy_pass $backend;
    }
}
