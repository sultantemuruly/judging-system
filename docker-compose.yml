version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: judging-server
    restart: unless-stopped
    ports:
      - "8080:8080"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: judging-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
