# Server and client for one ring. Open http://<this machine>/ on every device:
# nginx serves the app and proxies the WebSocket (/ws) to the server.
#   docker compose up --build -d
# Data (fight logs, tournament.json) is kept in the named volume judging-data.
# The admin login comes from .env next to this file (see .env.example).

services:
  server:
    build: ./server
    container_name: judging-server
    restart: unless-stopped
    environment:
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (see .env.example)}
    volumes:
      - judging-data:/app/data
    expose:
      - "8080"

  client:
    build: ./client
    container_name: judging-client
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  judging-data:
