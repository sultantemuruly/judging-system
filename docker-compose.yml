version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: judging-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Bind mount: файл лежит на хосте, контейнер читает/пишет его напрямую.
      # Данные сохраняются при перезапуске и можно редактировать файл вручную.
      - ./server/tournament_data.json:/app/tournament_data.json

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: judging-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
